# Fallback project spec for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Only needed if Timeleaf.xcodeproj does not open in your Xcode version:
#   brew install xcodegen && xcodegen generate
name: Timeleaf
options:
  bundleIdPrefix: com.timeleaf
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
targets:
  Timeleaf:
    type: application
    platform: iOS
    sources:
      - path: Timeleaf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeleaf.app
        PRODUCT_NAME: Timeleaf
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timeleaf
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSCameraUsageDescription: Timeleaf uses the camera so you can film a video or take a photo to send to the future.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Timeleaf uses the microphone to record voice notes and the sound of your videos.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Timeleaf lets you choose photos and videos to seal inside a letter.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Timeleaf uses Face ID to keep your letters private.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
