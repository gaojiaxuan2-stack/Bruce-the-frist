name: iOS build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcodebuild -showdestinations -project Unhook.xcodeproj -scheme Unhook | tee destinations.txt
          DEST_ID=$(grep "platform:iOS Simulator" destinations.txt | grep "name:iPhone" | head -1 | sed -E 's/.*id:([^,]+),.*/\1/')
          if [ -z "$DEST_ID" ]; then
            echo "No iPhone simulator available" >&2
            exit 1
          fi
          echo "Using simulator $DEST_ID"
          echo "id=$DEST_ID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          set +e
          xcodebuild test \
            -project Unhook.xcodeproj \
            -scheme Unhook \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-test.log | grep -E "error:|warning:|Test (Suite|Case|case|run)|✔|✘|\*\* TEST"
          # grep only trims the log; the step's result is xcodebuild's exit status.
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Build for device (Release)
        run: |
          set +e
          xcodebuild build \
            -project Unhook.xcodeproj \
            -scheme Unhook \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-release.log | grep -E "error:|warning:|\*\* BUILD"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild-*.log
            TestResults.xcresult
          if-no-files-found: ignore
